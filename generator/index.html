<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>교육 홈페이지 자동 생성기</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--ink:#222;--mut:#6b7280;--line:#e5e7eb;--blue:#003e7e;--soft:#eef3fa;--ok:#15803d;--warn:#b45309}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--ink:#e8ecf1;--mut:#97a1ae;--line:#2d3641;--blue:#6aa7ee;--soft:#222b36;--ok:#4ade80;--warn:#fbbf24}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
  h1{margin:0;text-align:center;font-size:26px;font-weight:800;color:var(--blue)}
  .sub{text-align:center;color:var(--mut);margin:6px 0 18px}
  .steps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .steps span{background:var(--soft);color:var(--blue);padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .grid{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;align-items:start}
  @media (max-width:920px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:20px}
  .card>h2,details>summary h2{margin:0;font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}
  .card>h2{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .num{background:var(--blue);color:var(--card);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px}
  #form{display:flex;flex-direction:column;gap:16px}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{grid-column:span 2}.field.half{grid-column:span 1}
  .field>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
  .field .h{font-size:12px;color:var(--mut);margin-top:3px}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
  textarea{resize:vertical;min-height:62px}
  input.hylu{border:2px solid var(--blue);background:var(--card)}
  #qrbox{display:flex;gap:12px;align-items:center;margin-top:8px;background:var(--soft);border-radius:10px;padding:10px}
  #qrbox img{width:76px;height:76px;image-rendering:pixelated;background:#fff;border-radius:6px}
  #qrbox small{color:var(--mut)}
  .img{display:flex;align-items:center;gap:10px}
  .img img{width:56px;height:42px;object-fit:contain;background:var(--bg);border:1px solid var(--line);border-radius:6px}
  .img small{color:var(--mut);word-break:break-all;display:block}
  .item{grid-column:span 2;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px;background:var(--bg)}
  .item .body{margin-top:10px}
  .item .bar{display:flex;gap:6px;align-items:center}.item .bar b{margin-right:auto}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:700}
  button:hover{border-color:var(--blue)}
  button.sm{padding:2px 8px;font-size:12px}
  button.main{background:var(--blue);color:var(--card);border-color:var(--blue);width:100%;padding:13px;font-size:15px}
  button.sec{width:100%;margin-top:8px;color:var(--blue);border-color:var(--blue);background:var(--card)}
  button.add{grid-column:span 2;border-style:dashed;color:var(--blue)}
  details.more{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  details.more>summary{padding:16px 20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.more>summary::after{content:"펼치기 ▾";font-size:12px;color:var(--mut)}
  details.more[open]>summary::after{content:"접기 ▴"}
  details.more>.body{padding:0 20px 20px}
  #side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button.on{background:var(--blue);color:var(--card);border-color:var(--blue)}
  .tabs .sp{margin-left:auto;display:flex;gap:6px}
  .frame{background:var(--soft);border-radius:10px;padding:8px;display:flex;justify-content:center;height:calc(100vh - 330px);min-height:420px}
  iframe{border:0;background:#fff;border-radius:6px;width:100%;height:100%}
  .frame.m iframe{width:390px}
  ul.check{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
  ul.check li{padding:7px 12px;border-radius:8px;background:var(--soft);font-size:13px}
  ul.check li.ok::before{content:"✔ ";color:var(--ok)}
  ul.check li.no{color:var(--warn)}ul.check li.no::before{content:"⚠ "}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .tools button{flex:1}
  #msg{min-height:20px;margin-top:8px;color:var(--ok);font-size:13px}
  .guide{font-size:12.5px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 교육 홈페이지 자동 생성기</h1>
  <p class="sub">교육 정보와 HY-LU 링크만 입력하면 홈페이지가 만들어집니다.</p>
  <div class="steps"><span>1~3 정보 입력</span><span>4 미리보기 확인</span><span>5 ZIP 내려받아 배포</span></div>

  <div class="grid">
    <section id="form"></section>

    <aside id="side">
      <div class="card">
        <h2><span class="num">4</span> 미리보기</h2>
        <div class="tabs" id="tabs"></div>
        <div class="frame" id="frame"><iframe id="ifr" title="미리보기"></iframe></div>
      </div>
      <div class="card">
        <h2><span class="num">5</span> 내려받기</h2>
        <ul class="check" id="check"></ul>
        <button class="main" id="bZip">사이트 ZIP 내려받기</button>
        <button class="sec" id="bSingle">단일 HTML 파일 내려받기</button>
        <button class="sec" id="bImgs">기존 이미지 폴더 불러오기 (site/images)</button>
        <input id="fImgs" type="file" webkitdirectory multiple hidden>
        <div id="msg"></div>
        <p class="guide">ZIP을 풀어 <code>site/</code> 폴더에 덮어쓴 뒤 배포하세요. 올리지 않은 이미지는 기존 <code>site/images/</code> 파일을 그대로 씁니다.</p>
        <div class="tools">
          <button id="bSave">설정 저장(.json)</button>
          <button id="bLoad">설정 불러오기</button>
          <button id="bReset">초기화</button>
        </div>
        <input id="fLoad" type="file" accept=".json,application/json" hidden>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="defaults.js"></script>
<script src="render.js"></script>
<script src="styles.js"></script>
<script>
(function(){
  var KEY="hy-academy-generator-v2", SITE="../site/", QR="images/apply-qr.png";
  var D, files={}, cur="index", timer;
  var PAGE_LABEL={index:"홈",program:"프로그램",education:"교육·일정",lineup:"라인업",apply:"신청",goods:"굿즈"};

  /* ---------- 입력 항목 (main:true = 항상 펼쳐진 카드, 나머지는 '세부 설정') ---------- */
  var T="text",A="area",L="lines",I="image",H=true;
  var STATUS=[["open","접수 중"],["closed","마감"]];
  var SES=[["open","접수 중"],["closed","마감"],["none","표시 안 함"]];
  var SCHEMA=[
    {t:"교육 기본 정보",n:"1",main:true,f:[
      {p:"program.title",l:"교육 이름"},
      {p:"program.round",l:"차수 표시",w:H,h:"예: 1차 · 통계특강"},
      {p:"program.month",l:"개설 월",w:H,h:"숫자만 (예: 9)"},
      {p:"program.venue",l:"장소",w:H},
      {p:"program.venueSub",l:"장소 상세",w:H},
      {p:"program.audience",l:"대상",w:H},
      {p:"program.fee",l:"참가비",w:H},
      {p:"program.status",l:"접수 상태",k:"select",o:STATUS,h:"‘마감’이면 신청 버튼이 숨겨집니다."}
    ]},
    {t:"HY-LU 신청 연결",n:"2",main:true,f:[
      {p:"apply.hylu",l:"HY-LU 프로그램 링크",k:"hylu",h:"붙여 넣으면 모든 ‘신청하기’ 버튼이 연결되고 QR이 자동 생성됩니다."}
    ]},
    {t:"회차 · 일정",n:"3",main:true,f:[
      {p:"education.sessions",l:"",k:"list",add:"+ 회차 추가",title:function(s){return (s.no||"")+" · "+(s.date||"날짜 미입력")},
        tpl:function(n){return {no:(n+1)+"회차",date:"",dow:"",time:"12:00 – 16:00",status:"open",title:"",lead:"",items:[]}},
        f:[{p:"no",l:"회차",w:H},{p:"date",l:"날짜",w:H,h:"예: 10.19"},{p:"dow",l:"요일",w:H,h:"예: 월요일"},{p:"time",l:"시간",w:H,h:"예: 12:00 – 16:00"},
           {p:"status",l:"상태",k:"select",o:SES},{p:"title",l:"회차 제목",k:A},{p:"lead",l:"한 줄 설명",k:A},{p:"items",l:"세부 내용 (한 줄에 하나)",k:L}]}
    ]},
    {t:"강연자",f:[
      {p:"lecturer.show",l:"강연자 소개 표시",k:"check"},
      {p:"lecturer.org",l:"소속",w:H},{p:"lecturer.name",l:"이름",w:H},{p:"lecturer.title",l:"직함",w:H},
      {p:"lecturer.sectionTitle",l:"섹션 제목",w:H},
      {p:"lecturer.logo",l:"소속 로고",k:I,slot:"lecturer-logo"},
      {p:"lecturer.lead",l:"소개글",k:A},
      {p:"lecturer.careers",l:"주요 경력",k:"list",add:"+ 경력",title:function(s){return s.text||"(비어 있음)"},tpl:function(){return {text:"",note:""}},f:[{p:"text",l:"내용"},{p:"note",l:"기간·비고"}]},
      {p:"lecturer.books",l:"저서",k:"list",add:"+ 저서",title:function(s){return s.text||"(비어 있음)"},tpl:function(){return {text:"",note:""}},f:[{p:"text",l:"제목"},{p:"note",l:"비고"}]},
      {p:"lecturer.projects",l:"대표 프로젝트 (한 줄에 하나)",k:L}
    ]},
    {t:"굿즈",f:[
      {p:"goods.headline",l:"제목 (줄바꿈 가능)",k:A},
      {p:"goods.items",l:"",k:"list",add:"+ 굿즈 추가",title:function(s){return s.name||"(이름 없음)"},tpl:function(){return {img:"",name:"",desc:"",cond:"워크숍 + 만족도 조사 참여"}},
        f:[{p:"name",l:"이름"},{p:"img",l:"사진",k:I,slot:"goods"},{p:"desc",l:"설명",k:A},{p:"cond",l:"수령 조건"}]}
    ]},
    {t:"소개 · 안내 문구",f:[
      {p:"program.tagline",l:"프로그램 슬로건"},
      {p:"program.questions",l:"이런 분께 (한 줄에 하나)",k:L},
      {p:"program.paragraphs",l:"소개 문단 (한 줄에 한 문단)",k:L},
      {p:"education.intro",l:"교육 소개글",k:A},
      {p:"education.showLocked",l:"‘추후 공개’ 잠금 카드 표시",k:"check"},
      {p:"lineup.lockedCount",l:"‘추후 공개’ 회차 수",k:"number",w:H},
      {p:"lineup.notice",l:"라인업 하단 안내"},
      {p:"apply.note",l:"신청 페이지 안내 문구",k:A},
      {p:"apply.step3",l:"STEP 3 문구 (비우면 장소로 자동)",k:A},
      {p:"home.lead",l:"홈 메인 문구",k:A},{p:"home.sub",l:"홈 보조 문구",k:A},{p:"home.hint",l:"홈 카드 아래 안내"},{p:"home.metaDesc",l:"검색·공유용 설명",k:A},
      {p:"program.heroDesc",l:"부제 · 프로그램"},{p:"education.heroDesc",l:"부제 · 교육"},{p:"lineup.heroDesc",l:"부제 · 라인업"},{p:"apply.heroDesc",l:"부제 · 신청"},{p:"goods.heroDesc",l:"부제 · 굿즈"}
    ]},
    {t:"이미지 (새로 올린 것만 반영)",f:[
      {p:"images.posterWide",l:"메인 포스터 (가로형)",k:I,slot:"poster-wide"},
      {p:"images.posterTall",l:"메인 포스터 (세로형·모바일)",k:I,slot:"poster-tall"},
      {p:"images.posterAlt",l:"포스터 대체 텍스트"},
      {p:"images.cardProgram",l:"홈 카드 · 프로그램",k:I,slot:"card-program"},
      {p:"images.cardEducation",l:"홈 카드 · 교육",k:I,slot:"card-education"},
      {p:"images.cardLineup",l:"홈 카드 · 라인업",k:I,slot:"card-lineup"},
      {p:"images.cardApply",l:"홈 카드 · 신청",k:I,slot:"card-apply"},
      {p:"images.cardGoods",l:"홈 카드 · 굿즈",k:I,slot:"goods-card"}
    ]},
    {t:"사이트 공통 · 배포 주소",f:[
      {p:"site.domain",l:"사이트 주소",h:"canonical · sitemap · robots에 반영됩니다."},
      {p:"site.name",l:"사이트 이름"},{p:"site.org",l:"기관명",w:H},{p:"site.orgEn",l:"기관명(영문)",w:H},
      {p:"site.address",l:"주소"},{p:"site.team",l:"문의 부서",w:H},{p:"site.phone",l:"전화",w:H},
      {p:"site.email",l:"이메일",w:H},{p:"site.year",l:"저작권 연도",w:H},{p:"home.kicker",l:"홈 상단 작은 글씨"}
    ]}
  ];

  /* ---------- 유틸 ---------- */
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function resolve(root,path){var ks=path.split("."),k=ks.pop(),o=root;ks.forEach(function(x){o=o[x]});return [o,k]}
  function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else if(k==="on")for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e[k]=attrs[k]}(kids||[]).forEach(function(c){e.appendChild(c)});return e}
  function say(t){var m=document.getElementById("msg");m.textContent=t;clearTimeout(say.t);say.t=setTimeout(function(){m.textContent=""},6000)}
  function b64bytes(u){var s=atob(u.split(",")[1]),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}

  /* ---------- 입력칸 ---------- */
  function mkField(f,o,k){
    var w=el("div",{className:"field"+(f.w?" half":"")}),kind=f.k||T,lab=el("label",{text:f.l}),inp;
    if(f.l||kind==="check")w.appendChild(lab);
    if(kind==="check"){
      inp=el("input",{type:"checkbox",checked:!!o[k],on:{change:function(){o[k]=this.checked;changed()}}});
      lab.insertBefore(inp,lab.firstChild);lab.style.cursor="pointer";
    }else if(kind==="select"){
      w.appendChild(el("select",{on:{change:function(){o[k]=this.value;changed()}}},f.o.map(function(x){return el("option",{value:x[0],text:x[1],selected:o[k]===x[0]})})));
    }else if(kind===A||kind===L){
      w.appendChild(el("textarea",{value:kind===L?(o[k]||[]).join("\n"):(o[k]||""),rows:kind===L?4:3,on:{input:function(){o[k]=kind===L?this.value.split("\n"):this.value;changed()}}}));
    }else if(kind===I){
      var img=el("img"),cap=el("small");
      var show=function(){var p=o[k]||"";img.src=files[p]?files[p].url:SITE+p;cap.textContent=(files[p]?"새 파일 · ":"기존 파일 · ")+p};
      var file=el("input",{type:"file",accept:"image/*",on:{change:function(){
        var fl=this.files[0];if(!fl)return;var ext=(fl.name.split(".").pop()||"png").toLowerCase().replace("jpeg","jpg");
        var slot=f.slot==="goods"?"goods-"+Date.now().toString(36):f.slot,path="images/"+slot+"."+ext;
        var r=new FileReader();r.onload=function(){files[path]={url:r.result,bytes:b64bytes(r.result)};o[k]=path;show();changed()};r.readAsDataURL(fl)}}});
      w.appendChild(el("div",{className:"img"},[img,el("div",{},[file,cap])]));show();
    }else if(kind==="hylu"){
      inp=el("input",{type:"text",className:"hylu",placeholder:"https://hylu-s.hanyang.ac.kr/ko/program/all/view/…",value:o[k]||"",on:{input:function(){o[k]=this.value.trim();makeQR();changed()}}});
      w.appendChild(inp);
      w.appendChild(el("div",{id:"qrbox"},[el("img",{id:"qrimg",alt:"QR"}),el("small",{id:"qrst"})]));
    }else{
      w.appendChild(el("input",{type:kind==="number"?"number":"text",value:o[k]==null?"":o[k],on:{input:function(){o[k]=kind==="number"?(+this.value||0):this.value;changed()}}}));
    }
    if(f.h)w.appendChild(el("div",{className:"h",text:f.h}));
    return w;
  }
  function mkList(f,arr,host){
    function draw(){
      host.querySelectorAll(".item,button.add").forEach(function(n){n.remove()});
      arr.forEach(function(it,i){
        var inner=el("div",{className:"body"});
        f.f.forEach(function(sf){var r=resolve(it,sf.p);inner.appendChild(mkField(sf,r[0],r[1]))});
        var bar=el("div",{className:"bar"},[el("b",{text:f.title(it,i)}),
          el("button",{className:"sm",text:"↑",on:{click:function(){if(i>0){arr.splice(i-1,0,arr.splice(i,1)[0]);draw();changed()}}}}),
          el("button",{className:"sm",text:"↓",on:{click:function(){if(i<arr.length-1){arr.splice(i+1,0,arr.splice(i,1)[0]);draw();changed()}}}}),
          el("button",{className:"sm",text:"삭제",on:{click:function(){arr.splice(i,1);draw();changed()}}})]);
        host.appendChild(el("div",{className:"item"},[bar,inner]));
      });
      host.appendChild(el("button",{className:"add",text:f.add,on:{click:function(){arr.push(f.tpl(arr.length));draw();changed()}}}));
    }
    draw();
  }
  function fill(body,g){
    g.f.forEach(function(f){
      var r=resolve(D,f.p);
      if(f.k==="list"){
        if(f.l)body.appendChild(el("div",{className:"field",style:"font-weight:700;font-size:12.5px"},[document.createTextNode(f.l)]));
        mkList(f,r[0][r[1]],body);
      }else body.appendChild(mkField(f,r[0],r[1]));
    });
  }
  function buildForm(){
    var form=document.getElementById("form");form.innerHTML="";
    SCHEMA.filter(function(g){return g.main}).forEach(function(g){
      var body=el("div",{className:"body"});fill(body,g);
      form.appendChild(el("div",{className:"card"},[el("h2",{},[el("span",{className:"num",text:g.n}),document.createTextNode(g.t)]),body]));
    });
    SCHEMA.filter(function(g){return !g.main}).forEach(function(g){
      var body=el("div",{className:"body"});fill(body,g);
      form.appendChild(el("details",{className:"more"},[el("summary",{},[el("h2",{text:g.t})]),body]));
    });
    makeQR();
  }

  /* ---------- QR ---------- */
  function makeQR(){
    var url=D.apply.hylu,img=document.getElementById("qrimg"),st=document.getElementById("qrst");
    if(!img)return;
    if(!url){delete files[QR];img.removeAttribute("src");st.textContent="링크를 입력하면 QR이 만들어집니다.";return}
    if(!window.qrcode){st.textContent="QR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.";return}
    var q=qrcode(0,"M");q.addData(url);q.make();
    var n=q.getModuleCount(),px=12,qz=2,size=(n+qz*2)*px,c=document.createElement("canvas");c.width=c.height=size;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,size,size);x.fillStyle="#000";
    for(var r=0;r<n;r++)for(var cc=0;cc<n;cc++)if(q.isDark(r,cc))x.fillRect((cc+qz)*px,(r+qz)*px,px,px);
    var u=c.toDataURL("image/png");files[QR]={url:u,bytes:b64bytes(u)};
    img.src=u;st.textContent="자동 생성됨 · 휴대폰으로 한 번 찍어 확인하세요.";
  }

  /* ---------- 점검 목록 ---------- */
  function problems(){
    var w=[];
    if(!D.apply.hylu)w.push("HY-LU 링크를 입력하세요.");
    else if(!/^https?:\/\//.test(D.apply.hylu))w.push("HY-LU 링크가 http(s)로 시작해야 합니다.");
    if(!String(D.program.title).trim())w.push("교육 이름을 입력하세요.");
    var ss=D.education.sessions||[];
    if(!ss.length)w.push("회차를 1개 이상 추가하세요.");
    else if(ss.some(function(s){return !String(s.date).trim()}))w.push("날짜가 비어 있는 회차가 있습니다.");
    return w;
  }
  function checklist(){
    var ul=document.getElementById("check");ul.innerHTML="";var w=problems();
    if(!w.length)ul.appendChild(el("li",{className:"ok",text:"필수 항목이 모두 입력되었습니다."}));
    w.forEach(function(t){ul.appendChild(el("li",{className:"no",text:t}))});
  }

  /* ---------- 미리보기 ---------- */
  function changed(){
    try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
    checklist();clearTimeout(timer);timer=setTimeout(preview,250);
  }
  var NAVJS='<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;var m=(a.getAttribute("href")||"").match(/^(index|program|education|lineup|apply|goods)\\.html$/);if(m){e.preventDefault();parent.postMessage({page:m[1]},"*")}});<\/script>';
  function preview(){
    var out;try{out=SiteRender.build(D,new Date().toISOString().slice(0,10))}catch(e){say("미리보기 오류: "+e.message);return}
    var html=out[cur+".html"];
    Object.keys(files).forEach(function(p){html=html.split(p).join(files[p].url)});
    html=html.replace("<head>",'<head><base href="'+SITE+'">').replace("</body>",NAVJS+"</body>");
    document.getElementById("ifr").srcdoc=html;
  }
  window.addEventListener("message",function(e){if(e.data&&e.data.page){cur=e.data.page;tabs()}});
  function tabs(){
    var t=document.getElementById("tabs");t.innerHTML="";
    SiteRender.pages.forEach(function(p){t.appendChild(el("button",{text:PAGE_LABEL[p],className:p===cur?"on":"",on:{click:function(){cur=p;tabs()}}}))});
    t.appendChild(el("span",{className:"sp"},[
      el("button",{className:"sm",text:"PC",on:{click:function(){document.getElementById("frame").className="frame"}}}),
      el("button",{className:"sm",text:"모바일",on:{click:function(){document.getElementById("frame").className="frame m"}}})]));
    preview();
  }

  /* ---------- ZIP (무압축) ---------- */
  var CRC=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
  function zip(entries){
    var enc=new TextEncoder(),parts=[],cd=[],off=0,now=new Date();
    var dt=((now.getFullYear()-1980)<<9|(now.getMonth()+1)<<5|now.getDate())&0xFFFF,tm=(now.getHours()<<11|now.getMinutes()<<5|now.getSeconds()>>1)&0xFFFF;
    entries.forEach(function(e){
      var nm=enc.encode(e.name),crc=crc32(e.data),sz=e.data.length,lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
      lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
      parts.push(new Uint8Array(lh.buffer),nm,e.data);
      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
      ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
      cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz;
    });
    var cdSize=cd.reduce(function(a,b){return a+b.length},0),end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
    return new Blob(parts.concat(cd,[new Uint8Array(end.buffer)]),{type:"application/zip"});
  }
  function download(blob,name){var a=el("a",{href:URL.createObjectURL(blob),download:name});document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},500)}

  document.getElementById("bZip").onclick=function(){
    var w=problems();
    if(w.length&&!confirm("확인이 필요합니다:\n- "+w.join("\n- ")+"\n\n그래도 내려받을까요?"))return;
    var date=new Date().toISOString().slice(0,10),enc=new TextEncoder(),out=SiteRender.build(D,date),ents=[],dump=JSON.stringify(D);
    Object.keys(out).forEach(function(n){ents.push({name:n,data:enc.encode(out[n])})});
    Object.keys(files).forEach(function(p){if(p===QR||dump.indexOf(p)>-1)ents.push({name:p,data:files[p].bytes})});
    ents.push({name:"program-data.json",data:enc.encode(JSON.stringify(D,null,2))});
    download(zip(ents),"site-"+date+"-"+(D.program.month||"")+"월.zip");
    say("ZIP 생성 완료 · 압축을 풀어 site/ 폴더에 덮어쓴 뒤 배포하세요.");
  };
  /* ---------- 단일 HTML 내보내기 ---------- */
  var SINGLE_JS='(function(){var IMG=window.__IMG||{};["srcset","src"].forEach(function(a){document.querySelectorAll("[data-"+a+"]").forEach(function(e){var u=IMG[e.getAttribute("data-"+a)];if(u)e.setAttribute(a,u)})});var pgs=[].slice.call(document.querySelectorAll(".pg"));'+
    'function show(){var k=(location.hash||"#index").slice(1);var t=pgs.filter(function(p){return p.dataset.page===k})[0]||pgs[0];'+
    'pgs.forEach(function(p){p.hidden=p!==t});window.scrollTo(0,0)}'+
    'window.addEventListener("hashchange",show);show();'+
    'pgs.forEach(function(pg){var b=pg.querySelector("[data-menubtn]"),m=pg.querySelector("[data-mobilemenu]"),o=pg.querySelector("[data-iconopen]"),c=pg.querySelector("[data-iconclose]");if(!b)return;'+
    'function set(x){m.classList.toggle("hidden",!x);o.classList.toggle("hidden",x);c.classList.toggle("hidden",!x);b.setAttribute("aria-expanded",String(x))}'+
    'b.addEventListener("click",function(){set(m.classList.contains("hidden"))});m.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(){set(false)})})});'+
    'var nh=matchMedia("(hover: none)").matches,rd=matchMedia("(prefers-reduced-motion: reduce)").matches;'+
    'if(nh&&!rd&&"IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle("is-on",e.isIntersecting)})},{rootMargin:"-38% 0px -38% 0px"});document.querySelectorAll(".card").forEach(function(c){io.observe(c)})}})();';

  function singleHtml(out){
    var keys=SiteRender.pages;
    var pages=keys.map(function(k){
      var h=out[k+".html"], cls=(h.match(/<body class="([^"]*)"/)||[])[1]||"";
      var s=h.indexOf(">",h.indexOf("<body"))+1, e=h.indexOf("<script>\n  var btn");
      var inner=h.slice(s,e)
        .replace(/href="(index|program|education|lineup|apply|goods)\.html"/g,'href="#$1"')
        .replace('id="menuBtn"','data-menubtn').replace('id="mobileMenu"','data-mobilemenu')
        .replace('id="iconOpen"','data-iconopen').replace('id="iconClose"','data-iconclose');
      return '<div class="pg '+cls+'" data-page="'+k+'" hidden>\n'+inner+'</div>\n';
    }).join("");
    var idx=out["index.html"];
    var head=idx.slice(0,idx.indexOf("</head>")).replace('<link rel="stylesheet" href="styles.css">',
      "<style>\n"+SITE_CSS+"\n.pg{min-height:100vh}.pg[hidden]{display:none}\n</style>");
    var html=head+"</head>\n<body class=\"font-sans antialiased\">\n"+pages+"<script>"+SINGLE_JS+"<\/script>\n</body>\n</html>\n";
    /* 이미지는 한 번만 담고(IMG), 각 페이지는 data-src 로 참조 → 파일 크기 중복 방지 */
    var missing={},used={};
    html=html.replace(/(src|srcset)="(images\/[^"]+)"/g,function(m,a,p){
      if(files[p]){used[p]=files[p].url;return "data-"+a+'="'+p+'"'}
      missing[p]=1;return m;
    });
    html=html.replace("<script>"+SINGLE_JS,"<script>window.__IMG="+JSON.stringify(used)+";"+SINGLE_JS);
    return {html:html,missing:Object.keys(missing)};
  }
  document.getElementById("bSingle").onclick=function(){
    var w=problems();
    if(w.length&&!confirm("확인이 필요합니다:\n- "+w.join("\n- ")+"\n\n그래도 내려받을까요?"))return;
    var r=singleHtml(SiteRender.build(D,new Date().toISOString().slice(0,10)));
    download(new Blob([r.html],{type:"text/html"}),"academy-"+new Date().toISOString().slice(0,10)+"-"+(D.program.month||"")+"월.html");
    say(r.missing.length?"완료 · 이미지 "+r.missing.length+"개는 파일에 포함하지 못했습니다. ‘기존 이미지 폴더 불러오기’를 먼저 눌러 주세요.":"단일 HTML 생성 완료 · 이 파일 하나만 있으면 열립니다.");
  };
  document.getElementById("bImgs").onclick=function(){document.getElementById("fImgs").click()};
  document.getElementById("fImgs").onchange=function(){
    var list=[].slice.call(this.files).filter(function(f){return /^image\//.test(f.type)}),n=0;
    if(!list.length){say("이미지를 찾지 못했습니다. site/images 폴더를 선택하세요.");return}
    list.forEach(function(f){var r=new FileReader();r.onload=function(){var p="images/"+f.name;if(!files[p])files[p]={url:r.result,bytes:b64bytes(r.result)};if(++n===list.length){say(n+"개 이미지를 불러왔습니다.");preview()}};r.readAsDataURL(f)});
  };
  document.getElementById("bSave").onclick=function(){download(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),"program-"+new Date().toISOString().slice(0,10)+".json")};
  document.getElementById("bLoad").onclick=function(){document.getElementById("fLoad").click()};
  document.getElementById("fLoad").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{D=Object.assign(clone(DEFAULT_PROGRAM),JSON.parse(r.result));buildForm();changed();say("불러왔습니다.")}catch(e){say("JSON을 읽지 못했습니다.")}};r.readAsText(f)};
  document.getElementById("bReset").onclick=function(){if(confirm("입력한 내용을 지우고 기본값(9월 워크숍)으로 되돌릴까요?")){D=clone(DEFAULT_PROGRAM);files={};buildForm();changed()}};

  /* ---------- 시작 ---------- */
  try{var s=localStorage.getItem(KEY);D=s?Object.assign(clone(DEFAULT_PROGRAM),JSON.parse(s)):clone(DEFAULT_PROGRAM)}catch(e){D=clone(DEFAULT_PROGRAM)}
  buildForm();checklist();tabs();
})();
</script>
